<div class="search-container">
  <div class="input-group">
    <div class="input-group-prepend">
      <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        {{ selectedField === 'name' ? 'Name' : 
           selectedField === 'location' ? 'Location' : 
           selectedField === 'description' ? 'Description' : 'All' }}
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" (click)="selectField('name')">Name</a></li>
        <li><a class="dropdown-item" (click)="selectField('location')">Location</a></li>
        <li><a class="dropdown-item" (click)="selectField('description')">Description</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" (click)="selectField('all')">All Fields</a></li>
      </ul>
    </div>
    <input 
      type="text" 
      class="form-control" 
      placeholder="Search universities..." 
      aria-label="Search" 
      [(ngModel)]="searchTerm" 
      (ngModelChange)="search($event)"
      (blur)="closeDropdown()"
      [disabled]="loading"
      autocomplete="off"
    >
    <button *ngIf="searchTerm" class="btn btn-outline-secondary" type="button" (click)="searchTerm = ''; search('')">
      <i class="bi bi-x"></i>
    </button>
    <button class="btn btn-primary" type="button">
      <i class="bi bi-search"></i>
    </button>
  </div>
  
  <!-- Auto-suggestions dropdown -->
  <div class="search-results" *ngIf="showDropdown && filteredUniversities.length > 0">
    <div class="list-group">
      <a 
        *ngFor="let university of filteredUniversities" 
        [routerLink]="['/universities', university.idUniv]" 
        class="list-group-item list-group-item-action"
      >
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1">{{ university.nomUniv }}</h6>
          <small *ngIf="university.location">{{ university.location }}</small>
        </div>
        <p *ngIf="university.description" class="mb-1 small text-truncate">{{ university.description }}</p>
      </a>
    </div>
  </div>
  
  <!-- Loading indicator -->
  <div *ngIf="loading" class="text-center mt-2">
    <div class="spinner-border spinner-border-sm text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
