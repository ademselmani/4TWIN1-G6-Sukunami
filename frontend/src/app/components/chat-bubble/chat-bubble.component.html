<!-- Chat Button -->
<div class="chat-button" [class.open]="isOpen" (click)="toggleChat()">
  <i class="bi" [ngClass]="isOpen ? 'bi-x' : 'bi-chat-dots-fill'"></i>
</div>

<!-- Chat Widget -->
<div class="chat-widget" [class.open]="isOpen">
  <div class="chat-header">
    <h5>University Assistant</h5>
    <button class="close-button" (click)="toggleChat()">
      <i class="bi bi-x"></i>
    </button>
  </div>
  
  <div class="chat-messages" #chatMessages>
    <div *ngFor="let message of messages" 
         [ngClass]="{'user-message': message.isUser, 'assistant-message': !message.isUser}"
         class="message">
      <div class="message-content">
        <span class="message-text" [innerHTML]="message.text | safe:'html'"></span>
        <small class="message-time">{{ message.timestamp | date:'shortTime' }}</small>
      </div>
      
      <!-- Map display for location-based queries -->
      <div *ngIf="message.hasMap && message.location" class="map-container mt-2">
        <div class="card">
          <div class="card-header bg-light py-1 px-2 d-flex justify-content-between align-items-center">
            <small class="text-muted"><i class="bi bi-geo-alt me-1"></i>{{ message.location }}</small>
            <a href="https://www.google.com/maps/search/{{ message.location }}" target="_blank" class="btn btn-sm btn-link py-0 px-1">
              <i class="bi bi-box-arrow-up-right"></i>
            </a>
          </div>
          <div class="card-body p-0">
            <iframe 
              [src]="'https://www.google.com/maps/embed/v1/place?key=AIzaSyDx9vAdvFLJteMRuOYkn8T15JBYIIt9LlI&q=' + message.location | safe:'resourceUrl'"
              width="100%" 
              height="200" 
              style="border:0;" 
              allowfullscreen="" 
              loading="lazy" 
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>
        </div>
      </div>
    </div>
    
    <div *ngIf="isLoading" class="typing-indicator">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  
  <div class="chat-input">
    <button 
      *ngIf="hasVoiceSupport" 
      class="voice-button" 
      [class.active]="isListening"
      (click)="toggleVoiceInput()" 
      [disabled]="isLoading">
      <i class="bi" [ngClass]="isListening ? 'bi-mic-fill' : 'bi-mic'"></i>
    </button>
    <input type="text" 
           [(ngModel)]="userInput" 
           placeholder="Ask about universities..." 
           (keyup.enter)="sendMessage()"
           [disabled]="isLoading || isListening">
    <button (click)="sendMessage()" [disabled]="isLoading || isListening || !userInput.trim()">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>

  <div class="chat-suggestions" *ngIf="!isLoading">
    <button class="suggestion-chip" (click)="useQuickQuestion('Show all universities')">
      Show all universities
    </button>
    <button class="suggestion-chip" (click)="useQuickQuestion('What are the university locations?')">
      University locations
    </button>
    <button class="suggestion-chip" (click)="useQuickQuestion('Show map for Esprit University')">
      Map for Esprit
    </button>
  </div>
</div>
