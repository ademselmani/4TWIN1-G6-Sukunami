<div class="container mt-4">
  <h2 class="mb-4">University Management</h2>
  
  <!-- Error Alert -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>
  
  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Add New University Form -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Add New University</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addUniversity()" #addForm="ngForm">
        <div class="mb-3">
          <label for="universityName" class="form-label">University Name</label>
          <input 
            type="text" 
            class="form-control" 
            id="universityName" 
            name="nomUniv"
            [(ngModel)]="newUniversity.nomUniv" 
            required
          >
        </div>
        <div class="mb-3">
          <label for="imagePath" class="form-label">Image URL</label>
          <input 
            type="text" 
            class="form-control" 
            id="imagePath" 
            name="imagePath"
            [(ngModel)]="newUniversity.imagePath" 
            placeholder="https://example.com/image.jpg"
          >
        </div>
        <div class="mb-3">
          <label for="location" class="form-label">Location</label>
          <input 
            type="text" 
            class="form-control" 
            id="location" 
            name="location"
            [(ngModel)]="newUniversity.location" 
            placeholder="City, Country"
          >
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea 
            class="form-control" 
            id="description" 
            name="description"
            [(ngModel)]="newUniversity.description" 
            rows="3"
            placeholder="Brief description of the university"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <i class="bi bi-plus-circle me-1"></i> Add University
        </button>
      </form>
    </div>
  </div>

  <!-- Universities List -->
  <div class="card">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">Universities List</h5>
    </div>
    <div class="card-body">
      <div *ngIf="universities.length === 0 && !loading" class="text-center py-3">
        <p>No universities found. Add one to get started.</p>
      </div>
      
      <table *ngIf="universities && universities.length > 0" class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Image</th>
            <th scope="col">Name</th>
            <th scope="col">Location</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let university of universities">
            <td *ngIf="editingUniversity?.idUniv !== university.idUniv">{{ university.idUniv }}</td>
            
            <!-- Image cell - display mode -->
            <td *ngIf="editingUniversity?.idUniv !== university.idUniv">
              <img *ngIf="university.imagePath" [src]="university.imagePath" class="img-thumbnail" style="max-width: 50px; max-height: 50px;" alt="University image">
              <span *ngIf="!university.imagePath">No image</span>
            </td>
            
            <!-- Image cell - edit mode -->
            <td *ngIf="editingUniversity?.idUniv === university.idUniv">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editingUniversity!.imagePath"
                placeholder="Image URL"
              />
            </td>
            
            <!-- Name cell - display mode -->
            <td *ngIf="editingUniversity?.idUniv !== university.idUniv">
              {{ university.nomUniv }}
              <small *ngIf="university.location" class="text-muted d-block">{{ university.location }}</small>
            </td>
            
            <!-- Name cell - edit mode -->
            <td *ngIf="editingUniversity?.idUniv === university.idUniv">
              <input
                type="text"
                class="form-control mb-2"
                [(ngModel)]="editingUniversity!.nomUniv"
                placeholder="University Name"
              />
            </td>
            
            <!-- Location cell - display mode -->
            <td *ngIf="editingUniversity?.idUniv !== university.idUniv">
              {{ university.location || 'Not specified' }}
            </td>
            
            <!-- Location cell - edit mode -->
            <td *ngIf="editingUniversity?.idUniv === university.idUniv">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editingUniversity!.location"
                placeholder="Location"
              />
              <textarea
                class="form-control mt-2"
                [(ngModel)]="editingUniversity!.description"
                placeholder="Description"
                rows="2"
              ></textarea>
            </td>
            
            <!-- Actions cell - same as before -->
            <td>
              <div class="btn-group">
                <!-- View button - always visible except when editing -->
                <button
                  *ngIf="editingUniversity?.idUniv !== university.idUniv && university.idUniv"
                  class="btn btn-primary btn-sm"
                  [routerLink]="['/universities', university.idUniv]"
                >
                  View
                </button>
                <!-- Edit button - only visible when not editing this university -->
                <button
                  *ngIf="editingUniversity?.idUniv !== university.idUniv"
                  class="btn btn-warning btn-sm"
                  (click)="startEdit(university)"
                >
                  Edit
                </button>
                <!-- Delete button - only visible when not editing this university -->
                <button
                  *ngIf="editingUniversity?.idUniv !== university.idUniv && university.idUniv"
                  class="btn btn-danger btn-sm"
                  (click)="deleteUniversity(university.idUniv!)"
                >
                  Delete
                </button>
                <!-- Save button - only visible when editing this university -->
                <button
                  *ngIf="editingUniversity?.idUniv === university.idUniv"
                  class="btn btn-success btn-sm"
                  (click)="saveEdit()"
                >
                  Save
                </button>
                <!-- Cancel button - only visible when editing this university -->
                <button
                  *ngIf="editingUniversity?.idUniv === university.idUniv"
                  class="btn btn-secondary btn-sm"
                  (click)="cancelEdit()"
                >
                  Cancel
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
