<div class="container mt-4">
  <h2 class="mb-4">University Management</h2>
  
  <!-- Error Alert -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>
  
  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Add New University Form -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Add New University</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addUniversity()" #addForm="ngForm">
        <div class="mb-3">
          <label for="universityName" class="form-label">University Name</label>
          <input 
            type="text" 
            class="form-control" 
            id="universityName" 
            name="nomUniv"
            [(ngModel)]="newUniversity.nomUniv" 
            required
          >
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <i class="bi bi-plus-circle me-1"></i> Add University
        </button>
      </form>
    </div>
  </div>

  <!-- Universities List -->
  <div class="card">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">Universities List</h5>
    </div>
    <div class="card-body">
      <div *ngIf="universities.length === 0 && !loading" class="text-center py-3">
        <p>No universities found. Add one to get started.</p>
      </div>
      
      <table *ngIf="universities.length > 0" class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let university of universities">
            <!-- Not editing mode -->
            <ng-container *ngIf="editingUniversity?.idUniv !== university.idUniv">
              <td>{{ university.idUniv }}</td>
              <td>{{ university.nomUniv }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-warning me-1" (click)="startEdit(university)">
                    <i class="bi bi-pencil-square"></i> Edit
                  </button>
                  <button class="btn btn-sm btn-danger" (click)="deleteUniversity(university.idUniv!)">
                    <i class="bi bi-trash"></i> Delete
                  </button>
                </div>
              </td>
            </ng-container>
            
            <!-- Editing mode -->
            <ng-container *ngIf="editingUniversity?.idUniv === university.idUniv">
              <td>{{ university.idUniv }}</td>
              <td>
                <input 
                  type="text" 
                  class="form-control" 
                  [(ngModel)]="editingUniversity.nomUniv" 
                  required
                >
              </td>
              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-success me-1" (click)="updateUniversity()">
                    <i class="bi bi-check-circle"></i> Save
                  </button>
                  <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">
                    <i class="bi bi-x-circle"></i> Cancel
                  </button>
                </div>
              </td>
            </ng-container>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
