<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2>File Upload</h2>
    </div>
    <div class="card-body">
      <!-- Error Message -->
      <div *ngIf="uploadStatus === 'error'" class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button type="button" class="btn-close" (click)="uploadStatus = 'idle'" aria-label="Close"></button>
      </div>
      
      <!-- Success Message -->
      <div *ngIf="uploadStatus === 'success'" class="alert alert-success alert-dismissible fade show" role="alert">
        File uploaded successfully!
        <button type="button" class="btn-close" (click)="uploadStatus = 'idle'" aria-label="Close"></button>
      </div>
      
      <!-- Upload Form -->
      <div class="mb-3">
        <label for="fileInput" class="form-label">Select a file to upload</label>
        <input 
          type="file" 
          class="form-control" 
          id="fileInput" 
          (change)="onFileSelected($event)"
          [disabled]="uploadStatus === 'uploading'">
      </div>
      
      <!-- Upload Button -->
      <button 
        class="btn btn-primary" 
        (click)="uploadFile()" 
        [disabled]="!selectedFile || uploadStatus === 'uploading'">
        Upload
      </button>
      
      <!-- Progress Bar -->
      <div *ngIf="uploadStatus === 'uploading'" class="mt-3">
        <div class="progress">
          <div 
            class="progress-bar progress-bar-striped progress-bar-animated" 
            role="progressbar" 
            [style.width.%]="uploadProgress"
            aria-valuenow="uploadProgress" 
            aria-valuemin="0" 
            aria-valuemax="100">
            {{uploadProgress}}%
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
